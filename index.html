<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07133D" />

    <title>Healthcare Labs — Advanced Diagnostics & Health Packages in Surat</title>
    <meta
      name="description"
      content="Advanced diagnostics, preventive health packages and trusted laboratory care — designed around you. Healthcare Labs, Surat."
    />
    <link rel="canonical" href="https://healthcare-labs.com/" />

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Healthcare Labs" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="Healthcare Labs — Advanced Diagnostics & Health Packages" />
    <meta
      property="og:description"
      content="Advanced diagnostics, preventive health packages and trusted laboratory care — designed around you."
    />
    <meta property="og:url" content="https://healthcare-labs.com/" />
    <meta property="og:image" content="https://healthcare-labs.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Healthcare Labs — Advanced Diagnostics & Health Packages" />
    <meta
      name="twitter:description"
      content="Advanced diagnostics, preventive health packages and trusted laboratory care — designed around you."
    />
    <meta name="twitter:image" content="https://healthcare-labs.com/og-image.jpg" />

    <!--
      Typeface: Plus Jakarta Sans for UI and headings, JetBrains Mono for the
      technical annotations in the hero and the diagnostic journey.
      Preconnect first so the font request starts before the CSS parses.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <!-- The hero renders on a deep navy ground; paint it before React mounts. -->
    <style>
      html {
        background-color: #07133d;
      }
      #root {
        min-height: 100vh;
        background-color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif; color: #101828">

        </p>
        <p>123-223-224, Royal Square, VIP Circle, Utran, Mota Varachha, Surat - 394105</p>
      </div>

    <script type="module" src="/src/main.tsx"></script>

</html>
